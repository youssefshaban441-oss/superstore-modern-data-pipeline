version: 2

models:
  - name: fact_order_line
    columns:
      - name: order_line_key
        data_tests:
          - not_null
          - unique

      - name: customer_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_key

      - name: product_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_key

      - name: location_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_location')
                field: location_key

      - name: order_date_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key

      - name: ship_date_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key

      - name: ship_mode_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_ship_mode')
                field: ship_mode_key

      - name: segment_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_segment')
                field: segment_key